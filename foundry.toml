[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["solmate=lib/solmate/src"]
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./artifacts" }]

[profile.ci]
verbosity = 3

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
mainnet = "${ETH_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
